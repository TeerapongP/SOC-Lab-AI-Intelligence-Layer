version: '3.8'


services:


  opencti-redis:
    image: redis:7.2-alpine
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - soc_mgmt
    volumes:
      - opencti_redis_data:/data
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  opencti-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - soc_mgmt
      - soc_shared
    volumes:
      - opencti_esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in opencti/.env}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in opencti/.env} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s


  opencti-minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - soc_mgmt
    volumes:
      - opencti_minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in opencti/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in opencti/.env}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s


  opencti-rabbitmq:
    image: rabbitmq:3.12-management
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - soc_mgmt
    volumes:
      - opencti_rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in opencti/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in opencti/.env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  opencti-platform:
    image: opencti/platform:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-redis:
        condition: service_healthy
      opencti-elasticsearch:
        condition: service_healthy
      opencti-minio:
        condition: service_healthy
      opencti-rabbitmq:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      APP__PORT: 8080
      APP__BASE_URL: ${OPENCTI_BASE_URL:-http://localhost:8082}
      APP__ADMIN__EMAIL: ${OPENCTI_ADMIN_EMAIL:?Set OPENCTI_ADMIN_EMAIL in opencti/.env}
      APP__ADMIN__PASSWORD: ${OPENCTI_ADMIN_PASSWORD:?Set OPENCTI_ADMIN_PASSWORD in opencti/.env}
      APP__ADMIN__TOKEN: ${OPENCTI_ADMIN_TOKEN:?Set OPENCTI_ADMIN_TOKEN in opencti/.env}

      REDIS__HOSTNAME: opencti-redis
      REDIS__PORT: 6379

      ELASTICSEARCH__URL: http://opencti-elasticsearch:9200
      ELASTICSEARCH__USERNAME: elastic
      ELASTICSEARCH__PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in opencti/.env}

      MINIO__ENDPOINT: opencti-minio
      MINIO__PORT: 9000
      MINIO__USE_SSL: "false"
      MINIO__ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in opencti/.env}
      MINIO__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in opencti/.env}

      RABBITMQ__HOSTNAME: opencti-rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__USERNAME: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in opencti/.env}
      RABBITMQ__PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in opencti/.env}

      NODE_OPTIONS: --max-old-space-size=4096

    deploy:
      resources:
        limits:
          memory: 4G

    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s


  opencti-worker:
    image: opencti/worker:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_mgmt
      - soc_shared
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_WORKER_ADMIN_TOKEN:?Set OPENCTI_WORKER_ADMIN_TOKEN in opencti/.env}
      WORKER_LOG_LEVEL: info
    deploy:
      resources:
        limits:
          memory: 1G


  connector-mitre:
    image: opencti/connector-mitre:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_MITRE_CONNECTOR_TOKEN:?Set OPENCTI_MITRE_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${MITRE_CONNECTOR_ID:?Set MITRE_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_NAME: "MITRE ATT&CK"
      CONNECTOR_SCOPE: identity,attack-pattern,course-of-action,intrusion-set,campaign,malware,tool
      CONNECTOR_CONFIDENCE_LEVEL: 75
      CONNECTOR_UPDATE_EXISTING_DATA: "true"
      CONNECTOR_LOG_LEVEL: info
      MITRE_REMOVE_STATEMENT_MARKING: "true"
      MITRE_INTERVAL: 7
    deploy:
      resources:
        limits:
          memory: 512M


  connector-alienvault:
    image: opencti/connector-alienvault:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_ALIENVAULT_CONNECTOR_TOKEN:?Set OPENCTI_ALIENVAULT_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${OTX_CONNECTOR_ID:?Set OTX_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_NAME: "AlienVault OTX"
      CONNECTOR_SCOPE: stix2
      CONNECTOR_CONFIDENCE_LEVEL: 40
      CONNECTOR_UPDATE_EXISTING_DATA: "false"
      CONNECTOR_LOG_LEVEL: info
      ALIENVAULT_BASE_URL: https://otx.alienvault.com
      ALIENVAULT_API_KEY: ${OTX_API_KEY:?Set OTX_API_KEY in opencti/.env}
      ALIENVAULT_TLP: White
      ALIENVAULT_CREATE_OBSERVABLES: "true"
      ALIENVAULT_CREATE_INDICATORS: "true"
      ALIENVAULT_PULSE_START_TIMESTAMP: 2024-01-01T00:00:00
      ALIENVAULT_REPORT_TYPE: threat-report
      ALIENVAULT_REPORT_STATUS: New
      ALIENVAULT_GUESS_MALWARE: "true"
      ALIENVAULT_GUESS_CVE: "true"
      ALIENVAULT_EXCLUDED_PULSE_INDICATOR_TYPES: ""
      ALIENVAULT_ENABLE_RELATIONSHIPS: "true"
      ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES: "true"
      ALIENVAULT_INTERVAL_SEC: 1800
    deploy:
      resources:
        limits:
          memory: 512M


  connector-abuse-ssl:
    image: opencti/connector-abuse-ssl:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_ABUSE_SSL_CONNECTOR_TOKEN:?Set OPENCTI_ABUSE_SSL_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${ABUSE_SSL_CONNECTOR_ID:?Set ABUSE_SSL_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_NAME: "Abuse.ch SSL Blacklist"
      CONNECTOR_CONFIDENCE_LEVEL: 70
      CONNECTOR_UPDATE_EXISTING_DATA: "true"
      CONNECTOR_LOG_LEVEL: info
      ABUSE_SSL_URL: https://sslbl.abuse.ch/blacklist/sslblacklist.csv
      ABUSE_SSL_INTERVAL: 3600
    deploy:
      resources:
        limits:
          memory: 256M


  connector-urlhaus:
    image: opencti/connector-urlhaus:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_URLHAUS_CONNECTOR_TOKEN:?Set OPENCTI_URLHAUS_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${URLHAUS_CONNECTOR_ID:?Set URLHAUS_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_NAME: "URLhaus"
      CONNECTOR_CONFIDENCE_LEVEL: 40
      CONNECTOR_UPDATE_EXISTING_DATA: "false"
      CONNECTOR_LOG_LEVEL: info
      URLHAUS_CSV_URL: https://urlhaus.abuse.ch/downloads/csv_recent/
      URLHAUS_IMPORT_OFFLINE: "true"
      URLHAUS_THREATS_FROM_LABELS: "true"
      URLHAUS_INTERVAL: 3600
    deploy:
      resources:
        limits:
          memory: 256M


  connector-virustotal-livehunt:
    image: opencti/connector-virustotal-livehunt-notifications:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_VIRUSTOTAL_LIVEHUNT_CONNECTOR_TOKEN:?Set OPENCTI_VIRUSTOTAL_LIVEHUNT_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${VIRUSTOTAL_LIVEHUNT_CONNECTOR_ID:?Set VIRUSTOTAL_LIVEHUNT_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: EXTERNAL_IMPORT
      CONNECTOR_NAME: "VirusTotal Livehunt"
      CONNECTOR_CONFIDENCE_LEVEL: 50
      CONNECTOR_LOG_LEVEL: info
      VIRUSTOTAL_LIVEHUNT_NOTIFICATIONS_API_KEY: ${VIRUSTOTAL_API_KEY:?Set VIRUSTOTAL_API_KEY in opencti/.env}
      VIRUSTOTAL_LIVEHUNT_NOTIFICATIONS_COOLDOWN_SECONDS: 300
      VIRUSTOTAL_LIVEHUNT_NOTIFICATIONS_MARK_AS_READ: "true"
      VIRUSTOTAL_LIVEHUNT_NOTIFICATIONS_CREATE_ALERT: "true"
      VIRUSTOTAL_LIVEHUNT_NOTIFICATIONS_EXTENSIONS: "exe,dll,ps1,js,vbs,doc,docx,xls,xlsx,pdf"
      VIRUSTOTAL_LIVEHUNT_NOTIFICATIONS_MIN_POSITIVES: 5
    deploy:
      resources:
        limits:
          memory: 256M


  connector-virustotal:
    image: opencti/connector-virustotal:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_VIRUSTOTAL_CONNECTOR_TOKEN:?Set OPENCTI_VIRUSTOTAL_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${VIRUSTOTAL_CONNECTOR_ID:?Set VIRUSTOTAL_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: INTERNAL_ENRICHMENT
      CONNECTOR_NAME: "VirusTotal"
      CONNECTOR_SCOPE: StixFile,Artifact,IPv4-Addr,IPv6-Addr,Domain-Name,Url
      CONNECTOR_AUTO: "true"
      CONNECTOR_CONFIDENCE_LEVEL: 50
      CONNECTOR_LOG_LEVEL: info
      VIRUSTOTAL_TOKEN: ${VIRUSTOTAL_TOKEN:?Set VIRUSTOTAL_TOKEN in opencti/.env}
      VIRUSTOTAL_MAX_TLP: TLP:AMBER
      VIRUSTOTAL_REPLACE_WITH_LOWER_SCORE: "true"
      VIRUSTOTAL_FILE_CREATE_YARA_RULE: "true"
      VIRUSTOTAL_FILE_INDICATOR_CREATE_POSITIVES: 10
      VIRUSTOTAL_FILE_INDICATOR_VALID_MINUTES: 2880
      VIRUSTOTAL_URL_CREATE_POSITIVES: 10
      VIRUSTOTAL_URL_INDICATOR_CREATE_POSITIVES: 10
      VIRUSTOTAL_URL_INDICATOR_VALID_MINUTES: 2880
      VIRUSTOTAL_IP_INDICATOR_CREATE_POSITIVES: 10
      VIRUSTOTAL_IP_INDICATOR_VALID_MINUTES: 2880
      VIRUSTOTAL_IP_ADD_RELATIONSHIPS: "true"
      VIRUSTOTAL_DOMAIN_INDICATOR_CREATE_POSITIVES: 10
      VIRUSTOTAL_DOMAIN_INDICATOR_VALID_MINUTES: 2880
      VIRUSTOTAL_DOMAIN_ADD_RELATIONSHIPS: "true"
    deploy:
      resources:
        limits:
          memory: 256M


  connector-abuseipdb:
    image: opencti/connector-abuseipdb:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_ABUSEIPDB_CONNECTOR_TOKEN:?Set OPENCTI_ABUSEIPDB_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${ABUSEIPDB_CONNECTOR_ID:?Set ABUSEIPDB_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: INTERNAL_ENRICHMENT
      CONNECTOR_NAME: "AbuseIPDB"
      CONNECTOR_SCOPE: IPv4-Addr
      CONNECTOR_AUTO: "true"
      CONNECTOR_CONFIDENCE_LEVEL: 70
      CONNECTOR_LOG_LEVEL: info
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:?Set ABUSEIPDB_API_KEY in opencti/.env}
      ABUSEIPDB_MAX_AGE_IN_DAYS: 30
      ABUSEIPDB_ABUSE_SCORE_THRESHOLD: ${ABUSEIPDB_SCORE:-80}
    deploy:
      resources:
        limits:
          memory: 256M


  connector-ipinfo:
    image: opencti/connector-ipinfo:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_IPINFO_CONNECTOR_TOKEN:?Set OPENCTI_IPINFO_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${IPINFO_CONNECTOR_ID:?Set IPINFO_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: INTERNAL_ENRICHMENT
      CONNECTOR_NAME: "IPInfo"
      CONNECTOR_SCOPE: IPv4-Addr,IPv6-Addr
      CONNECTOR_AUTO: "true"
      CONNECTOR_CONFIDENCE_LEVEL: 75
      CONNECTOR_LOG_LEVEL: info
      IPINFO_TOKEN: ${IPINFO_TOKEN:?Set IPINFO_TOKEN in opencti/.env}
      IPINFO_MAX_TLP: TLP:AMBER
    deploy:
      resources:
        limits:
          memory: 256M


  connector-shodan:
    image: opencti/connector-shodan:5.12.17
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      opencti-platform:
        condition: service_healthy
    networks:
      - soc_shared
      - soc_mgmt
    environment:
      OPENCTI_URL: http://opencti-platform:8080
      OPENCTI_TOKEN: ${OPENCTI_SHODAN_CONNECTOR_TOKEN:?Set OPENCTI_SHODAN_CONNECTOR_TOKEN in opencti/.env}
      CONNECTOR_ID: ${SHODAN_CONNECTOR_ID:?Set SHODAN_CONNECTOR_ID in opencti/.env}
      CONNECTOR_TYPE: INTERNAL_ENRICHMENT
      CONNECTOR_NAME: "Shodan"
      CONNECTOR_SCOPE: IPv4-Addr
      CONNECTOR_AUTO: "true"
      CONNECTOR_CONFIDENCE_LEVEL: 75
      CONNECTOR_LOG_LEVEL: info
      SHODAN_TOKEN: ${SHODAN_TOKEN:?Set SHODAN_TOKEN in opencti/.env}
      SHODAN_MAX_TLP: TLP:AMBER
      SHODAN_CREATE_INDICATORS: "true"
    deploy:
      resources:
        limits:
          memory: 256M


networks:
  soc_shared:
    external: true


  soc_mgmt:
    driver: bridge


volumes:
  opencti_redis_data:
  opencti_esdata:
  opencti_minio_data:
  opencti_rabbitmq_data:
